<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Smart City Incident Response Agent</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar-title">
    <span class="pulse-dot"></span>
    Smart City Incident Response Agent
  </div>
  <div class="topbar-actions">
    <span id="clock" class="clock"></span>
    <button id="resetBtn" class="btn btn-ghost">Reset Demo</button>
  </div>
</header>

<main class="layout">

  <!-- LEFT: Live incident queue -->
  <section class="panel queue-panel">
    <h2>Live Priority Queue <span id="queueCount" class="badge">0</span></h2>
    <div id="queueList" class="queue-list"></div>
  </section>

  <!-- CENTER: City map -->
  <section class="panel map-panel">
    <h2>City Map</h2>
    <svg id="cityMap" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="legend">
      <span><i class="dot hospital"></i>Hospital</span>
      <span><i class="dot dispensary"></i>Dispensary</span>
      <span><i class="dot fire"></i>Fire Station</span>
      <span><i class="dot factory"></i>Factory</span>
      <span><i class="dot traffic"></i>Traffic Pt.</span>
      <span><i class="dot incident sev5"></i>Incident (by severity)</span>
      <span><i class="road blocked"></i>Blocked road</span>
    </div>
  </section>

  <!-- RIGHT: Report form + analytics -->
  <aside class="panel side-panel">

    <div class="side-block">
      <h2>Report an Incident</h2>
      <form id="reportForm">
        <label>Type</label>
        <select id="f_type">
          <option value="auto">Not sure / let the agent classify</option>
          <option value="fire">Fire / Hazard</option>
          <option value="medical">Medical / Injury</option>
          <option value="factory">Factory / Industrial</option>
          <option value="road_blockage">Road Blockage / Traffic</option>
        </select>

        <label>Description</label>
        <textarea id="f_desc" rows="3" placeholder="What are you seeing?"></textarea>

        <label>Location</label>
        <select id="f_location"></select>

        <div id="f_trafficFields" class="hidden">
          <label>Affected road</label>
          <select id="f_road"></select>
          <label>Destination junction</label>
          <select id="f_dest"></select>
        </div>

        <label>Reporter confidence: <span id="f_confVal">0.9</span></label>
        <input type="range" id="f_confidence" min="0" max="1" step="0.05" value="0.9" />

        <button type="submit" class="btn btn-primary">Submit Report</button>
      </form>
      <p class="hint">Tip: set confidence below 0.3 to demo false-report detection.</p>
    </div>

    <div class="side-block">
      <h2>Analytics</h2>
      <div id="analytics" class="analytics-grid"></div>
      <div id="bottlenecks" class="bottleneck-list"></div>
    </div>

  </aside>
</main>

<!-- Incident detail modal -->
<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal">
    <button id="modalClose" class="modal-close">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
